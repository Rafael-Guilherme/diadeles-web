# Servidor dos três builds estáticos. O mesmo arquivo serve site, educador e
# família — o que muda entre eles é só o conteúdo de /usr/share/nginx/html.
#
# `__API_ORIGEM__` é substituído no build (ver Dockerfile): a CSP precisa
# liberar a origem exata da API em `connect-src`, e ela só é conhecida quando se
# sabe para qual domínio este build está indo.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O proxy do Coolify já entrega gzip para o cliente, mas ele só consegue
    # comprimir o que recebe comprimível — e o bundle vai de 350 kB para 110 kB.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Nada de anunciar a versão do nginx para quem varre a internet.
    server_tokens off;

    #
    # Segunda tranca do source map.
    #
    # O build já não gera `.map` (vite.config.base.ts), e esta regra garante que
    # ele não seja servido nem se alguém ligar o flag por engano. São dois
    # mecanismos para a mesma coisa de propósito: a falha aqui é silenciosa e
    # definitiva — ninguém percebe que o código-fonte está no ar até estar.
    #
    location ~ \.map$ {
        return 404;
    }

    #
    # Os arquivos com hash no nome podem ser guardados para sempre: um novo
    # deploy gera outro nome, então nunca existe conteúdo velho num nome antigo.
    #
    location /assets/ {
        include /etc/nginx/seguranca.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    #
    # O oposto: estes quatro **não** podem ser guardados.
    #
    # O `index.html` é quem aponta para o bundle novo, e o service worker é quem
    # decide quando o app instalado se atualiza. Um `sw.js` em cache é um app
    # que nunca mais recebe correção — e aqui isso significa uma educadora
    # presa numa versão de fevereiro sem nenhum sintoma visível.
    #
    location ~* ^/(index\.html|registerSW\.js|sw\..+\.js)$ {
        include /etc/nginx/seguranca.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # O `types` vazio zera o mapa herdado só aqui dentro, para o `default_type`
    # valer: sem o tipo correto o Android ignora o manifest e não oferece
    # instalar o app.
    location = /manifest.webmanifest {
        include /etc/nginx/seguranca.inc;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    #
    # Rotas do app (`/turma/abc`, `/gestao/equipe`) não existem em disco: quem
    # resolve é o React Router, depois que o index.html carrega. Sem este
    # fallback, recarregar a página numa rota interna dá 404 — e é exatamente
    # o que a família faz ao abrir o link do aviso.
    #
    location / {
        include /etc/nginx/seguranca.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
